<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>普通話 App 第3版｜學習頁</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="普通話學習頁">
      <div class="profile-header">
        <header class="system-statusbar" aria-label="手機系統狀態欄">
          <time datetime="09:41">9:41</time>
          <img
            src="./assets/ios-status-icons.svg"
            alt="滿格蜂窩訊號、Wi-Fi、100% 電量"
          />
        </header>

        <section class="profile-hero" aria-label="學員資訊">
          <div class="profile-content">
            <img class="avatar" src="./assets/deer-avatar.png" alt="學員頭像" />
            <div class="profile-copy">
              <h1>劉小川</h1>
              <p class="class-pill">S1 A班</p>
            </div>
          </div>
        </section>
      </div>

      <section class="stats-strip" aria-label="學習概況">
        <article class="stat-item">
          <img src="./1x-v2-2透明版/pending-selected-36px-transparent.png" alt="" />
          <strong>132</strong>
          <span>待完成任務</span>
        </article>
        <article class="stat-item">
          <img src="./1x-v2-2透明版/learning-record-selected-36px-transparent.png" alt="" />
          <strong>399</strong>
          <span>練習記錄</span>
        </article>
        <a class="stat-item ranking-stat" href="#" aria-label="查看排行榜">
          <img src="./1x-v2-2透明版/ranking-selected-36px-transparent.png?v=202608111602" alt="" />
          <span class="ranking-copy">
            <strong>排行榜</strong>
            <em>查看排名</em>
          </span>
        </a>
      </section>

      <section class="report-card" aria-label="學習報告">
        <div class="report-visual">
          <img src="./1x-v2-2透明版/learning-report-icon-36px-transparent.png" alt="" />
        </div>
        <div class="report-copy">
          <h2>7月學習成長報告出爐啦！</h2>
          <p>看看這個月的學習進步吧</p>
        </div>
        <a class="report-action" href="#" aria-label="查看學習報告">
          <span aria-hidden="true">
            <i data-lucide="chevron-right"></i>
          </span>
        </a>
      </section>

      <section class="section-block oral-block" aria-label="口語訓練">
        <div class="section-title">
          <span class="title-mark"></span>
          <h2>口語訓練</h2>
        </div>
        <div class="oral-grid">
          <a class="oral-card blue" href="#">
            <img src="./1x-v2-2透明版/pronunciation-assessment-selected-36px-transparent.png" alt="" />
            <span>發音評測</span>
          </a>
          <a class="oral-card orange" href="#">
            <img src="./1x-v2-2透明版/scene-dialogue-selected-36px-transparent.png" alt="" />
            <span>場景對話</span>
          </a>
          <a class="oral-card violet" href="#">
            <img src="./1x-v2-2透明版/personal-short-speech-selected-36px-transparent.png" alt="" />
            <span>個人短講</span>
          </a>
          <a class="oral-card green" href="#">
            <img src="./1x-v2-2透明版/look-at-picture-and-speak-selected-36px-transparent.png" alt="" />
            <span>看圖說話</span>
          </a>
        </div>
      </section>

      <section class="section-block pinyin-block" aria-label="拼音專項">
        <div class="section-title">
          <span class="title-mark green"></span>
          <h2>拼音專項</h2>
        </div>
        <div class="pinyin-grid">
          <a class="pinyin-card" href="#">
            <img src="./1x-v2-2透明版/pinyin-learning-selected-36px-transparent.png" alt="" />
            <div>
              <strong>拼音學習</strong>
            </div>
          </a>
          <a class="pinyin-card mint" href="#">
            <img src="./1x-v2-2透明版/pinyin-practice-selected-36px-transparent.png" alt="" />
            <div>
              <strong>拼音練習</strong>
            </div>
          </a>
        </div>
      </section>

      <section class="section-block more-block" aria-label="更多練習">
        <div class="section-title">
          <span class="title-mark purple"></span>
          <h2>更多練習</h2>
        </div>
        <div class="mini-grid">
          <a class="mini-card" href="#">
            <img src="./1x-v2-2透明版/deer-character-selected-36px-transparent.png" alt="" />
            <span>小鹿認字</span>
          </a>
          <a class="mini-card" href="#">
            <img src="./1x-v2-2透明版/listening-practice-selected-36px-transparent.png" alt="" />
            <span>聽力練習</span>
          </a>
          <a class="mini-card" href="#">
            <img src="./1x-v2-2透明版/composition-correction-selected-36px-transparent.png" alt="" />
            <span>作文批改</span>
          </a>
          <a class="mini-card" href="#">
            <img src="./1x-v2-2透明版/composition-correction-dse-selected-36.png" alt="" />
            <span>作文批改<br />（DSE）</span>
          </a>
        </div>
      </section>

      <nav class="tabbar" aria-label="底部導航">
        <a class="tab active" href="./index.html">
          <i data-lucide="book-open" aria-hidden="true"></i>
          <span>學習</span>
        </a>
        <a class="tab" href="./tasks.html">
          <i data-lucide="clipboard-list" aria-hidden="true"></i>
          <span>任務</span>
        </a>
        <a class="tab" href="#">
          <i data-lucide="share-2" aria-hidden="true"></i>
          <span>拓展課</span>
        </a>
        <a class="tab" href="#">
          <i data-lucide="video" aria-hidden="true"></i>
          <span>直播課</span>
        </a>
      </nav>

      <div class="device-home-area" aria-hidden="true">
        <img class="home-indicator" src="./assets/ios-home-indicator.svg" alt="" />
      </div>
    </main>
    <script src="./assets/lucide.min.js"></script>
    <script>
      globalThis.lucide?.createIcons();
    </script>
  </body>
</html>
