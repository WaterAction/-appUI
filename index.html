<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>普通話 App 第3版｜學習頁</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="普通話學習頁">
      <div class="profile-header">
        <header class="system-statusbar" aria-label="手機系統狀態欄">
          <time datetime="09:41">9:41</time>
          <img
            src="./assets/ios-status-icons.svg"
            alt="滿格蜂窩訊號、Wi-Fi、100% 電量"
          />
        </header>

        <section class="profile-hero" aria-label="學員資訊">
          <div class="profile-content">
            <img class="avatar" src="./assets/deer-avatar.png" alt="學員頭像" />
            <div class="profile-copy">
              <p class="eyebrow">普通話學習</p>
              <h1>劉小川</h1>
              <p class="class-pill">S1 A班</p>
              <p class="greeting">今天一起把發音練得更漂亮</p>
            </div>
          </div>
          <img class="hero-mascot" src="./assets/deer-avatar.png" alt="" />
        </section>
      </div>

      <section class="stats-strip" aria-label="學習概況">
        <article class="stat-item">
          <img src="./1x-V2/icon-pending-selected.png" alt="" />
          <strong>132</strong>
          <span>待完成任務</span>
        </article>
        <article class="stat-item">
          <img src="./1x-V2/icon-learning-record-selected.png" alt="" />
          <strong>399</strong>
          <span>練習記錄</span>
        </article>
        <article class="stat-item ranking-stat">
          <img src="./1x-V2/icon-ranking-selected.png" alt="" />
          <span>排行榜</span>
        </article>
      </section>

      <section class="report-card" aria-label="學習報告">
        <div class="report-visual">
          <img src="./1x-V2/icon-learning-record-selected.png" alt="" />
        </div>
        <div>
          <p class="section-kicker">學習報告</p>
          <h2>7月學習報告已出爐</h2>
          <p>流暢度 +12%，聲調更穩</p>
        </div>
        <a class="report-action" href="#" aria-label="查看學習報告">查看</a>
      </section>

      <section class="section-block oral-block" aria-label="口語訓練">
        <div class="section-title">
          <span class="title-mark"></span>
          <h2>口語訓練</h2>
        </div>
        <div class="oral-grid">
          <a class="oral-card warm" href="#">
            <img src="./1x-V2/icon-pronunciation-selected.png" alt="" />
            <span>發音評測</span>
          </a>
          <a class="oral-card coral" href="#">
            <img src="./1x-V2/icon-dialogue-selected.png" alt="" />
            <span>場景對話</span>
          </a>
          <a class="oral-card violet" href="#">
            <img src="./1x-V2/icon-solo-talk-selected.png" alt="" />
            <span>個人短講</span>
          </a>
          <a class="oral-card sky" href="#">
            <img src="./1x-V2/icon-picture-speaking-selected.png" alt="" />
            <span>看圖說話</span>
          </a>
        </div>
      </section>

      <section class="section-block pinyin-block" aria-label="拼音學習">
        <div class="section-title">
          <span class="title-mark green"></span>
          <h2>拼音練習</h2>
        </div>
        <div class="pinyin-grid">
          <a class="pinyin-card" href="#">
            <img src="./1x-V2/icon-pinyin-learning-selected.png" alt="" />
            <div>
              <strong>拼音學習</strong>
            </div>
          </a>
          <a class="pinyin-card mint" href="#">
            <img src="./1x-V2/icon-pinyin-practice-selected.png" alt="" />
            <div>
              <strong>拼音練習</strong>
            </div>
          </a>
        </div>
      </section>

      <section class="section-block more-block" aria-label="更多練習">
        <div class="section-title">
          <span class="title-mark purple"></span>
          <h2>更多練習</h2>
        </div>
        <div class="mini-grid">
          <a class="mini-card" href="#">
            <img src="./1x-V2/icon-deer-literacy-selected.png" alt="" />
            <span>小鹿認字</span>
          </a>
          <a class="mini-card" href="#">
            <img src="./1x-V2/icon-listening-selected.png" alt="" />
            <span>聽力練習</span>
          </a>
          <a class="mini-card" href="#">
            <img src="./1x-V2/icon-essay-review-selected.png" alt="" />
            <span>作文批改</span>
          </a>
          <a class="mini-card" href="#">
            <img src="./1x-V2/icon-dse-essay-review-selected.png" alt="" />
            <span>作文批改<br />（DSE）</span>
          </a>
        </div>
      </section>

      <nav class="tabbar" aria-label="底部導航">
        <a class="tab active" href="#">
          <img src="./1x-V2/tab-learning-selected.png" alt="" />
          <span>學習</span>
        </a>
        <a class="tab" href="#">
          <img src="./1x-V2/tab-tasks-default.png" alt="" />
          <span>任務</span>
        </a>
        <a class="tab" href="#">
          <img src="./1x-V2/tab-extension-default.png" alt="" />
          <span>拓展課</span>
        </a>
        <a class="tab" href="#">
          <img src="./1x-V2/tab-live-default.png" alt="" />
          <span>直播課</span>
        </a>
      </nav>

      <div class="device-home-area" aria-hidden="true">
        <img class="home-indicator" src="./assets/ios-home-indicator.svg" alt="" />
      </div>
    </main>
  </body>
</html>
