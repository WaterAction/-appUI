<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>普通話 App 第3版：直播課</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell tasks-shell live-shell" aria-label="普通話直播課頁">
      <header class="system-statusbar" aria-label="手機系統狀態欄">
        <time datetime="09:41">9:41</time>
        <img
          src="./assets/ios-status-icons.svg"
          alt="滿格蜂窩訊號、Wi-Fi、100% 電量"
        />
      </header>

      <section class="task-hero live-hero" aria-label="直播課頁首">
        <h1>直播課</h1>
        <a class="task-report-link" href="#" aria-label="查看學習報告">
          <img src="./1x-v2-2透明版/learning-report-icon-36px-transparent.png" alt="" />
        </a>
      </section>

      <section class="live-shortcuts" aria-label="常用入口">
        <a class="live-shortcut violet" href="./tasks.html">
          <span class="live-shortcut-icon">
            <img src="./3x-透明版/task-tab-selected@3x.png" alt="" />
            <em>6</em>
          </span>
          <span>作業</span>
        </a>
        <a class="live-shortcut amber" href="#">
          <span class="live-shortcut-icon">
            <img src="./1x-v2-2透明版/learning-report-icon-36px-transparent.png" alt="" />
          </span>
          <span>學習報告</span>
        </a>
        <a class="live-shortcut blue" href="#">
          <span class="live-shortcut-icon">
            <i data-lucide="square-pen" aria-hidden="true"></i>
            <em>14</em>
          </span>
          <span>在線習題</span>
        </a>
        <a class="live-shortcut rose" href="#">
          <span class="live-shortcut-icon">
            <i data-lucide="users-round" aria-hidden="true"></i>
          </span>
          <span>我的班級</span>
        </a>
      </section>

      <section class="live-courses" aria-label="我的直播課程">
        <header class="live-section-head">
          <div class="section-title">
            <span class="title-mark live-mark"></span>
            <h2>我的課程</h2>
          </div>
          <a class="live-more" href="#">查看更多 <i data-lucide="chevron-right" aria-hidden="true"></i></a>
        </header>

        <div class="live-course-list">
          <article class="live-course-card is-upcoming">
            <div class="live-card-top">
              <span class="live-status upcoming">未開始</span>
            </div>
            <div class="live-title-row">
              <h3>第1講：第一課</h3>
              <a class="live-enter-circle" href="#" aria-label="進入第1講課程">
                <i data-lucide="chevron-right" aria-hidden="true"></i>
              </a>
            </div>
            <div class="live-time-row">
              <i data-lucide="clock" aria-hidden="true"></i>
              <strong>04:00—04:45</strong>
            </div>
            <time datetime="2026-07-20">2026-07-20</time>
            <footer class="live-card-actions">
              <a class="course-action live-action" href="#">預習</a>
            </footer>
          </article>

          <article class="live-course-card is-live">
            <div class="live-card-top">
              <span class="live-status ongoing">上課中</span>
              <span class="attendance-tag attended">已出勤</span>
            </div>
            <div class="live-title-row">
              <h3>第2講：第二課</h3>
              <a class="live-enter-circle" href="#" aria-label="進入第2講課程">
                <i data-lucide="chevron-right" aria-hidden="true"></i>
              </a>
            </div>
            <div class="live-time-row">
              <i data-lucide="clock" aria-hidden="true"></i>
              <strong>04:00—04:45</strong>
            </div>
            <time datetime="2026-07-27">2026-07-27</time>
            <footer class="live-card-actions">
              <a class="course-action live-action enter-course" href="#">進入教室</a>
            </footer>
          </article>

          <article class="live-course-card is-ended">
            <div class="live-card-top">
              <span class="live-status ended">已結束</span>
              <span class="attendance-tag attended">已出勤</span>
            </div>
            <div class="live-title-row">
              <h3>第3講：第三課</h3>
              <a class="live-enter-circle" href="#" aria-label="查看第3講課程詳情">
                <i data-lucide="chevron-right" aria-hidden="true"></i>
              </a>
            </div>
            <div class="live-time-row">
              <i data-lucide="clock" aria-hidden="true"></i>
              <strong>04:00—04:45</strong>
            </div>
            <time datetime="2026-08-03">2026-08-03</time>
            <footer class="live-card-actions">
              <a class="course-action live-action material" href="#">查看課件</a>
              <a class="course-action live-action replay" href="#">查看回放</a>
            </footer>
          </article>

          <article class="live-course-card is-ended">
            <div class="live-card-top">
              <span class="live-status ended">已結束</span>
              <span class="attendance-tag leave">已請假</span>
            </div>
            <div class="live-title-row">
              <h3>第4講：第四課</h3>
              <a class="live-enter-circle" href="#" aria-label="查看第4講課程詳情">
                <i data-lucide="chevron-right" aria-hidden="true"></i>
              </a>
            </div>
            <div class="live-time-row">
              <i data-lucide="clock" aria-hidden="true"></i>
              <strong>05:00—05:45</strong>
            </div>
            <time datetime="2026-08-10">2026-08-10</time>
            <footer class="live-card-actions">
              <a class="course-action live-action material" href="#">查看課件</a>
            </footer>
          </article>

          <article class="live-course-card is-ended">
            <div class="live-card-top">
              <span class="live-status ended">已結束</span>
              <span class="attendance-tag absent">缺席</span>
            </div>
            <div class="live-title-row">
              <h3>第5講：第五課</h3>
              <a class="live-enter-circle" href="#" aria-label="查看第5講課程詳情">
                <i data-lucide="chevron-right" aria-hidden="true"></i>
              </a>
            </div>
            <div class="live-time-row">
              <i data-lucide="clock" aria-hidden="true"></i>
              <strong>05:00—05:45</strong>
            </div>
            <time datetime="2026-08-17">2026-08-17</time>
            <footer class="live-card-actions">
              <a class="course-action live-action material" href="#">查看課件</a>
            </footer>
          </article>
        </div>
      </section>

      <div class="live-toast" role="status">狀態異常，請聯繫我們</div>
      <button class="live-refresh" type="button" aria-label="刷新直播課狀態">
        <i data-lucide="refresh-cw" aria-hidden="true"></i>
      </button>

      <nav class="tabbar" aria-label="底部導航">
        <a class="tab" href="./Study.html">
          <img class="tab-icon" src="./3x-透明版/learning-tab-unselected@3x.png" alt="" />
          <span>學習</span>
        </a>
        <a class="tab" href="./tasks.html">
          <img class="tab-icon tab-icon-task" src="./3x-透明版/task-tab-selected@3x.png" alt="" />
          <span>任務</span>
        </a>
        <a class="tab" href="./extension.html">
          <img class="tab-icon" src="./3x-透明版/extension-course-tab-unselected@3x.png" alt="" />
          <span>拓展課</span>
        </a>
        <a class="tab active" href="./live.html">
          <img class="tab-icon" src="./3x-透明版/live-class-tab-selected@3x.png" alt="" />
          <span>直播課</span>
        </a>
      </nav>

      <div class="device-home-area" aria-hidden="true">
        <img class="home-indicator" src="./assets/ios-home-indicator.svg" alt="" />
      </div>
    </main>
    <script src="./assets/lucide.min.js"></script>
    <script>
      globalThis.lucide?.createIcons();
    </script>
  </body>
</html>
